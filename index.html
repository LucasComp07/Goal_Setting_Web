<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goaltivity</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <header>
        <ul>
            <li class="navBtn" value="1">In Progress</li>
            <li class="navBtn" value="2">Completed</li>
            <li class="navBtn" value="3">All</li>
        </ul>
    </header>
    <div id="body">
        <dialog modal-content class="modal" id="modal">
            <div class="modalTitle modalAll">
                <h2 id="title">hey</h2>
                <button id="CloseModal">X</button>
            </div>
            <div class="modalContent modalAll"></div>
        </dialog>
        <div class="bodyChild bodychild1">

        </div>

        <dialog class="modalTodo">
            <div class="createTodos">
                <div class="containerTodos" id="createTodosContainer">
                    <h1 class="textCreate textTitle">CREATE A GOAL</h1>
                    <button id="removeBtn">X</button>
                </div>
                <div  class="containerTodos">
                    <input type="text" class="todoTitle goalInput">
                </div>
                <div  class="containerTodos">
                    <button class="todoButton btnTodos">SET GOAL</button>
                </div>
                
                <h2 class='textCreate'>SHORT TERM GOALS</h2>
                <div class="containerTodos" id="shortGoalArea">
                    <input type="text" class="shortGoal goalInput">
                </div>
                <div class="containerTodos buttonContainer">
                    <button class="btnTodos" id="addGoal">Add more</button>
                    <button class="btnTodos" id="removeGoal">Remove</button>
                </div>
            </div>
        </dialog>
    </div>

    <footer>
        <button id="createBtn">Create Goal</button> 
    </footer>
  
    <script type="module" src="./js/index.js"></script>
</body>
</html>
